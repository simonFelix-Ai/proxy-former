experiment_name: "proxy_former_img_tiny_imagenet_jit"

# Model configuration
fm_model:
  module: "src.models.architectures.img.fm"
  class_name: "FlowMatchingModel"

  d_model: 512
  d_attn_scale: 1
  d_fine: 64
  d_head: 64
  n_layers: 12

  dropout: 0.0
  history_enable: enable
  rope_enable: true

  patch_size: 8

  ema_decay: 0.999

  use_ae: false

  cfg_enable: false

########################################
data:
  module: "src.dataset.data_loader_hf_img"
  class_name: "data_loader_hf_img"

  output_dir: "./out/dataset_cache/tiny-imagenet/out/"
  dataset_dir: "./out/dataset_cache/tiny-imagenet/raw_ds/"

  dataset_path: "zh-plus/tiny-imagenet"
  dataset_name: "default"

  train_split: "train"
  test_split: "valid"

  inputs_key: "label"
  targets_key: "image"

  num_workers: 10

  img_h: 64
  img_w: 64
  img_channels: 3

  num_classes: 200

########################################
# Training configuration
training:
  module: "src.trainer.train_img_fm"
  func: "train"

  optimizer: "mano" # adamw or AdamW8bit
  learning_rate: 2.0e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.98
  grad_clip: 1.0

  lr_scheduler:
    enable: true
    
    type: "warmup_then_cosine" #"cosine"
    
    warmup_ratio: 0.06

    min_lr: 1.0e-5

  # Training loop
  num_train_epochs: 300


  # stride: 512
  train_ratio: 1.0 
  
  gradient_accumulation: 1  # 梯度累积后的等效反向传播

  #  BATCH_SIZE
  per_device_train_batch_size: 96
  
  # Logging and saving
  logging_steps: 10 # Log every accumulated step
  save_tokens_ratio: 0.2 # SAVE_MODLE_STEPS
  
  
  train_stage: "fm" # "ar" or "fm"

eval:
  module: "src.evaluator.eval_niah"
  func: "evaluate"

  eval_image_steps: 3000
  nfe_steps: 50
  ig_scale: 1.0

  eval_ratio: 1.0 
  per_device_eval_batch_size: 1

########################################
# Profile
profiler:
  enable: false
  log_dir: "out/profiler/"
  wait: 16  # wait: 等待1步
  warmup: 16  # warmup: 预热1步
  active: 16  # active: 真正分析的3步
  repeat: 4  # repeat: 重复2次这个周期    
########################################


# Hardware
hardware:
  device: "cuda"
  autocast: true # true or false
  compile: true # true or false
  auto_eager: true # true or false
